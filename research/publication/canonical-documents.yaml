    "evidenceState": "not-applicable",
    "body": "## Shape and activity, seen on a string\n\nA string fixed at both ends supports particular wave patterns. One has an arch between the ends; another has an additional stationary point in the middle. Length and boundaries constrain what fits, while tension and mass per unit length also matter. [See the string example](/examples/string/).\n\nRRG looks at the arrangement and its activity together. The wave has a moving shape, and the string’s constraints determine which patterns it can support.\n\n## Resonant: what is the activity?\n\nThe string makes a rhythm visible. In RRG’s broad language, [resonance](/glossary/#resonance) is motion that has fallen into rhythm. Chaotic motion has no lasting organizing rhythm standing out. Each physical example keeps its own meaning and tests of resonance.\n\nA [mode](/glossary/#mode) describes the activity in detail: frequency, relative timing or phase, strength or amplitude, spatial pattern, coupling, response and characteristic times. A single number in hertz describes only part of it. A visible beat is not required. [Read the mode definition](/claims/UT-D02/).\n\n## Geometry: what supports that activity?\n\nA [cell](/examples/cell/) shows the relation working in both directions. Its membrane regulates exchange; ongoing activity helps maintain the boundary and chemical conditions. Shape constrains activity, and activity supports or changes shape. Neither comes first.\n\n[Geometry](/glossary/#geometry-shape) means the components, arrangement, relationships, connections, orientation, boundaries and constraints at a chosen scale. Visible outline is only part of it. [Read the geometry definition](/claims/UT-D01/).\n\nWhere their mutual support lasts, RRG calls the whole a [resonator](/glossary/#resonator). The shorthand is $R=(G,M)$: organization $G$ and full activity $M$, with $G\\leftrightarrow M$. A physical model still supplies forces, material properties and energy conditions. [Read the resonant-geometry definition](/claims/UT-D03/) and [the world explanation](/documents/world-explanation/#1-start-from-one-simple-idea).\n\n## Within a thing, and between things\n\nA molecule’s compatible internal activity is [inner resonance](/glossary/#inner-resonance) in RRG’s language. Its compatible coupling to other things is [outer resonance](/glossary/#outer-resonance). Neither adds a force or requires identical frequencies. [Read the distinction](/documents/world-explanation/#61-forces-gather-and-hold-resonance-decides-what-fits-and-lasts).\n\n[Stability](/concepts/stability/) asks how long the pair holds. [Recursion](/concepts/recursion/) asks how the whole can open further organization and the cycle repeat at another scale.\n\nCompare [carbon arrangements](/examples/carbon-arrangement/) and [brain wiring and activity](/examples/brain/).\n",
    "sourceMapping": "RRG v0.3.3 01 §§0–2: name-rules, resonance versus chaotic motion, full modes, string and mutual support; §§3–3.1: persistence; §6.1: inner/outer resonance without extra forces or identical frequencies; §10: maintained cell illustration. Unchanged core §§1–3, 12: geometry, full mode structure and reciprocal pair; material, force and energy conditions remain necessary.",
