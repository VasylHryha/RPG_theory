    "evidenceState": "not-applicable",
    "body": "## What changes when you fix the ends?\n\nA string fixed at both ends cannot move in every possible pattern. Its length and boundaries constrain the motion; tension and mass per unit length help determine the response. One supported pattern has an arch between the ends; another has an additional stationary point in the middle. Read the [string illustration](/examples/string/).\n\nRRG calls the relevant organization **geometry**. It includes relationships, components and constraints, rather than only visible outline. The **mode structure** describes the organized activity: patterns, relative timing, responses and characteristic times. It is broader than one vibration frequency.\n\n## How the two descriptions connect\n\nA cell makes the reciprocal relation easier to see. Its membrane regulates exchange; ongoing activity helps maintain the membrane and chemical conditions. The arrangement affects activity, and activity can maintain or alter the arrangement. Read the [cell explanation](/examples/cell/).\n\nThis does not make geometry a replacement for physical laws. The string still needs its material and force conditions. Nor must every system vibrate visibly: mode structure may include relaxation, transport or coordinated processes.\n\n## The exact source meanings\n\n::claim{id=\"UT-D01\" view=\"plainLanguage\"}\n\n::claim{id=\"UT-D02\" view=\"plainLanguage\"}\n\n::claim{id=\"UT-D03\" view=\"plainLanguage\"}\n\nThe source writes $R=(G,M)$ for an organized system: $G$ denotes its geometry and $M$ its temporal mode structure. This is the framework's definition, not an extra independently established physical law. Neither side is defined as universally first.\n\nContinue with [stability](/concepts/stability/) to ask when an organization persists, or [all concepts](/concepts/) for the reading path.\n",
