    "plainLanguage": "## What RRG currently claims\n\nThe minimal locked core describes organization and mode structure together, including persistence, effective units and recursion. The current companion centres how organization can reshape the background available for later organization. A universal law or one equation family across all scales is a stronger open extension, not a completed result.\n\n## What existing evidence supports\n\nThe [evidence guide](/evidence/) separates local component mechanisms, partial bridges, comparisons and methods. The audited catalogue contains 22 cases; supplementary literature enriches the reading map without changing that membership. The apparatus, drives and assumptions of each case matter.\n\n## What remains unverified\n\nA connected source-to-repeated-level causal construction; the same principle across multiple levels with specified dynamics; a distinctive quantitative prediction; fundamental unification; cosmology; arbitrary engineered laws; and an RRG-specific AI result. Physical background change and mathematical coarse-graining are different operations.\n\n## What would change confidence?\n\n**Strengthen a specified model:** connected causal stages, repeated levels, quantitative predictions and independent tests under stated conditions.\n\n**Weaken a specified model:** failed predictions, a counterexample to its precise universal statement, no meaningful exclusions, or alternatives explaining its claimed distinctive predictions equally well. These are routes for investigation, not a new website evidence score.\n\n## What can contributors work on now?\n\nAn evidence case, model, simulation, prediction, counterexample, mathematical derivation or source correction—with assumptions and limits stated. [Explore the open questions](/open-problems/) or [contact the maintainer](/about/).\n\n## Read the original audit\n\nThe exact source-reported audit follows below. Its scientific checks are attributed to the supplied 2 October 2026 document; this website did not reproduce the studies or independently certify a universal theory. Its dated statement about pending attribution, licences and external publication describes that source-package stage. The first public website edition was owner-authorized and released on 6 October 2026; current website identity and rights are recorded on [Cite](/cite/) and [Rights](/legal/).\n",
    "scope": "Research status reported by the supplied documents, with explicit extension boundaries.",
