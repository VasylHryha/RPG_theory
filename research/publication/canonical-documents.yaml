    "statement": null,
    "plainLanguage": "The following six questions come directly from current status. They are extensions or applications to prove, rather than definitions. The proof matrix distinguishes evidence for a specific claim from a failed extension; failure does not by itself permit a core redefinition.",
    "scope": "The open extensions in current status, connected to source-stated evidence and failure criteria.",
    "evidenceState": "proposed",
    "body": "## Stable question IDs\n\n1. :claim[UT-O01] — fundamental interactions.\n2. :claim[UT-O02] — gravity.\n3. :claim[UT-O03] — background selection.\n4. :claim[UT-O04] — a cross-domain invariant or promotion criterion.\n5. :claim[UT-O05] — a novel prediction.\n6. :claim[UT-O06] — measurable AI advantages.\n\n## What would count against an extension?\n\nRead the [current proof matrix](/research-status/proof-matrix/) for each claim’s reported status, evidence target, contrary result and core impact. The [framework’s failure criteria](/framework/#15-what-would-falsify-or-weaken-specific-rrg-claims) distinguish core contradiction candidates from failed extensions: lack of a transferable invariant, predictive reduction, spontaneous hierarchy or novel prediction can weaken a proposed extension. Wrong known physics or trivial universality are also stated failure criteria.\n\nThe [mathematical model’s strong failure conditions](/math/#19-strong-failure-conditions) include manually imposed clusters or hierarchy, lost predictive power after coarse-graining, and lack of robust persistence under perturbation. These are tests of that proposed implementation. [Metrics](/math/#18-metrics) and [the next concrete calculation](/math/#40-next-concrete-calculation) state the current programme; no calculation is reported as completed here.\n\n## Effective interactions: the narrower open question\n\nThe [07 addendum’s final section](/evidence/interactions/#5-what-remains-open) asks under what general conditions an effective interaction generated or activated by one organization can stabilize or enable another. Its phonon, spin-ice and background-field examples do not close universal force unification. The [08 register](/evidence/additional/) contributes other scoped realizations, without changing the core or supplying that universal derivation.\n",
