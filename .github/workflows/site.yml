name: Verify and owner-controlled publication
on:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: Verify privately, or request an already authorized publication
        type: choice
        options: [verify, publish]
        default: verify
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run verify
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
  prepare:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'publish' && vars.UNITY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: node --import tsx scripts/check-publication.ts --require-deploy true
      - run: npm run build -- --mode release --output dist/deploy
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: node --import tsx scripts/seal-deployment.ts --dir dist/deploy
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          name: github-pages
          path: dist/deploy
          retention-days: 1
  deploy:
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.operation == 'publish' && vars.UNITY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: owner-approved-pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          artifact_name: github-pages
